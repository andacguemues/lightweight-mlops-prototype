name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project
        run: uv sync --locked

      - name: Check formatting and code quality
        run: |
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts

      - name: Reproduce complete MLOps pipeline
        run: uv run dvc repro

      - name: Run automated tests
        run: uv run pytest -v

      - name: Validate artifact
        run: uv run python scripts/validate_artifact.py

      - name: Build and test Docker service
        run: |
          docker compose up -d --build

          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              echo "Prediction API is healthy."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker compose logs
              exit 1
            fi

            sleep 2
          done

          curl --fail \
            http://127.0.0.1:8000/model-info

          docker compose down