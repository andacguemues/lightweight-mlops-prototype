data:
  raw_path: data/raw/bank-additional/bank-additional-full.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
  target: y
  test_size: 0.2
  random_state: 42

model:
  output_path: models/model.joblib
  type: logistic_regression
  max_iter: 1000
  class_weight: balanced

evaluation:
  metrics_path: reports/evaluation/metrics.json

mlflow:
  experiment_name: bank-marketing-classification
  run_name: logistic-regression-dvc
  registered_model_name: bank-marketing-classifier
  model_alias: candidate
  minimum_roc_auc: 0.75

monitoring:
  reference_path: data/processed/test.csv
  no_drift_path: data/simulated/no_drift.csv
  drifted_path: data/simulated/drifted.csv
  report_dir: reports/monitoring
  summary_path: reports/monitoring/monitoring_summary.json
  simulation_manifest_path: reports/monitoring/simulation_manifest.json
  drift_share: 0.2
  random_state: 42