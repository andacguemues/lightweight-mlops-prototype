[project]
name = "lightweight-mlops-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AGS", email = "andacxxxxx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "evidently>=0.7.21",
    "fastapi>=0.137.1",
    "jupyter>=1.1.1",
    "mlflow>=3.13.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
lightweight-mlops-prototype = "lightweight_mlops_prototype:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.build-backend]
module-name = "mlops_prototype"
module-root = "src"
